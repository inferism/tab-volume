<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 14px; font: 14px system-ui, sans-serif; }
    .row { display: flex; align-items: center; gap: 10px; }
    #slider { flex: 1; }
    #label { width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
    .buttons { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 6px; cursor: pointer; }
    #error { color: #b00020; margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="row">
    <input id="slider" type="range" min="0" max="400" step="5" value="100">
    <span id="label">100%</span>
  </div>
  <div class="buttons">
    <button id="mute">Mute</button>
    <button id="reset">Reset</button>
  </div>
  <div id="error"></div>
  <script src="popup.js"></script>
</body>
</html>
